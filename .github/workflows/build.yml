name: CI

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 6 * * *'  # At 06:00 every day

jobs:

  build:
    runs-on: [ self-hosted, image-builders ]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ( github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/build') &&
        (
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    permissions:
      pull-requests: write
    strategy:
      matrix:
        os: [ 'centos', 'almalinux' ]
        version: [ '9', '10' ]
    container:
      image: quay.io/ovirt/buildcontainer:almalinux10
      options: --privileged
      volumes:
        - /dev:/dev

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Kiwi
      run: |
          dnf install -y epel-release
          dnf install -y kiwi-cli gdisk

    - name: Build images
      env:
        DISTRO: ${{ matrix.os }}
        DISTRO_VERSION: ${{ matrix.version }}
        BUILD_STORAGE: 1
        BUILD_ENGINE_INSTALLED: 1
        BUILD_HOST_INSTALLED: 1
        BUILD_HE_INSTALLED: 1
      run: |
        cd ..
        ost-images/build.sh

    - name: Upload rpms to resources.ovirt.org
      uses: ovirt/ovirt-resources-upload-action@main
      with:
        username: ${{ secrets.SSH_USERNAME_FOR_RESOURCES_OVIRT_ORG }}
        key: ${{ secrets.SSH_KEY_FOR_RESOURCES_OVIRT_ORG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_FOR_RESOURCES_OVIRT_ORG }}
        source: rpmbuild/RPMS/x86_64/*.rpm
        target: github-ci/ost-images
        cleanup: yes
        # keep 40 last rpms (not necessarily complete set of images) + repodata
        keep_files_count: 41
        
    - name: Upload console log to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: console-${{ matrix.os }}${{ matrix.version }}
        path: "*.log"

    - name: Report back results
      if: github.event.issue.pull_request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        MESSAGE="Built images:\\n$(for i in rpmbuild/RPMS/x86_64/*.rpm; do echo -n https://resources.ovirt.org/repos/ovirt/github-ci/ost-images/$(basename $i)\\n; done)"
        curl -H "Authorization: Token ${GITHUB_TOKEN}" -X POST -d "{\"body\": \"${MESSAGE}\"}" ${{github.event.issue.url}}/comments

  createrepo:
    permissions: {}
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Create or update repository metadata
      uses: ovirt/ovirt-resources-upload-action@main
      with:
        username: ${{ secrets.SSH_USERNAME_FOR_RESOURCES_OVIRT_ORG }}
        key: ${{ secrets.SSH_KEY_FOR_RESOURCES_OVIRT_ORG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_FOR_RESOURCES_OVIRT_ORG }}
        target: github-ci/ost-images
        createrepo: yes